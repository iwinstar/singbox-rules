name: Convert rules
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"
  push:
    branches: 
      - main
    paths-ignore:
      - "**/README.md"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup build time
        run: |
          echo "BUILD_TIME=$(date --rfc-3339=seconds)" >> ${GITHUB_ENV}

      - name: Checkout singbox-rules
        uses: actions/checkout@v7
        with:
          repository: iwinstar/singbox-rules
          path: singbox-rules
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout easymosdns
        uses: actions/checkout@v7
        with:
          repository: pmkol/easymosdns
          path: easymosdns
          ref: rules

      - name: Checkout AWAvenue-Ads-Rule
        uses: actions/checkout@v7
        with:
          repository: TG-Twilight/AWAvenue-Ads-Rule
          path: AWAvenue-Ads-Rule
          ref: main

      - name: Convert json files
        run: |
          mkdir -p ./singbox-rules/resources
          python ./singbox-rules/scripts/convert_json.py ./easymosdns ./singbox-rules/resources
          cp ./AWAvenue-Ads-Rule/Filters/AWAvenue-Ads-Rule-Singbox.json ./singbox-rules/resources

      - name: Convert srs files
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.12/sing-box-1.12.12-linux-amd64.tar.gz -O sing-box.tar.gz && tar zxvf sing-box.tar.gz sing-box-1.12.12-linux-amd64/sing-box --strip-components 1
          chmod 755 sing-box
          ./sing-box version
          bash ./singbox-rules/scripts/convert_srs.sh ./sing-box ./singbox-rules/resources
          rm ./sing-box

      - name: Git Commit files
        run: |
          cd singbox-rules
          git status

          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Released on ${{ env.BUILD_TIME }}"
          else
            echo "No changes to commit."
          fi
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          directory: singbox-rules
