name: Convert
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"
  push:
    branches: 
      - main
    paths-ignore:
      - "**/README.md"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup build time
        run: |
          echo "BUILD_TIME=$(date --rfc-3339=seconds)" >> ${GITHUB_ENV}

      - name: Checkout singbox-rules
        uses: actions/checkout@v7
        with:
          repository: iwinstar/singbox-rules
          path: singbox-rules
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout easymosdns
        uses: actions/checkout@v7
        with:
          repository: pmkol/easymosdns
          path: easymosdns
          ref: rules

      - name: Checkout AWAvenue-Ads-Rule
        uses: actions/checkout@v7
        with:
          repository: TG-Twilight/AWAvenue-Ads-Rule
          path: AWAvenue-Ads-Rule
          ref: main

      - name: Convert json files
        run: |
          mkdir -p ./singbox-rules/resources
          python ./singbox-rules/scripts/convert_json.py ./easymosdns ./singbox-rules/resources
          cp ./AWAvenue-Ads-Rule/Filters/AWAvenue-Ads-Rule-Singbox.json ./singbox-rules/resources

      - name: Convert srs files
        run: |
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.13.21/sing-box-1.13.21-linux-amd64.tar.gz -O sing-box.tar.gz && tar zxvf sing-box.tar.gz sing-box-1.13.21-linux-amd64/sing-box --strip-components 1
          chmod 755 sing-box
          ./sing-box version
          bash ./singbox-rules/scripts/convert_srs.sh ./sing-box ./singbox-rules/resources
          rm ./sing-box

      - name: Force push to rules branch
        working-directory: singbox-rules/resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b rules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Released on ${BUILD_TIME}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin rules

